name: PHP syntax and local demo smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: demo_root_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        shell: bash
        run: |
          php -v
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install PDO MySQL and MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-mysql mysql-client
      - name: Import isolated sample database
        env:
          MYSQL_PWD: demo_root_pass
        run: mysql --host=127.0.0.1 --user=root < database/setup.sql
      - name: Exercise both versions on localhost
        env:
          CAS_DB_HOST: 127.0.0.1
          CAS_DB_PORT: "3306"
          CAS_DB_NAME: cas_hoa_security_lab
          CAS_DB_USER: root
          CAS_DB_PASSWORD: demo_root_pass
        shell: bash
        run: |
          php -S localhost:8000 -t . > /tmp/cas-php.log 2>&1 &
          sleep 2
          curl -fsS http://localhost:8000/v1/index.php -o /tmp/v1-home.html
          curl -fsS http://localhost:8000/v2/index.php -o /tmp/v2-home.html
          grep -q 'Garden' /tmp/v1-home.html
          grep -q 'Garden' /tmp/v2-home.html
          curl -fsSG --data-urlencode 'term=Garden' http://localhost:8000/v2/sqli.php -o /tmp/v2-garden.html
          grep -q 'QUERY RESULT / 1 RECORD(S)' /tmp/v2-garden.html
          curl -fsSG --data-urlencode "term=' OR is_public = 0 #" http://localhost:8000/v1/sqli.php -o /tmp/v1-sqli.html
          grep -q 'Hồ sơ ẩn' /tmp/v1-sqli.html
          curl -fsSG --data-urlencode "term=' OR is_public = 0 #" http://localhost:8000/v2/sqli.php -o /tmp/v2-sqli.html
          grep -q 'QUERY RESULT / 0 RECORD(S)' /tmp/v2-sqli.html
          curl -sS -o /tmp/v2get.txt -w '%{http_code}' http://localhost:8000/v2/update-profile.php > /tmp/status.txt
          grep -q '302' /tmp/status.txt
          # Verify harmless reflected XSS exists in V1 but is encoded in V2.
          curl -fsSG --data-urlencode "q=<img src=x onerror=alert(1)>" http://localhost:8000/v1/xss.php -o /tmp/v1-xss.html
          curl -fsSG --data-urlencode "q=<img src=x onerror=alert(1)>" http://localhost:8000/v2/xss.php -o /tmp/v2-xss.html
          grep -Fq '<img src=x onerror=alert(1)>' /tmp/v1-xss.html
          grep -Fq '&lt;img src=x onerror=alert(1)&gt;' /tmp/v2-xss.html
          # Log in with separate demo sessions and test a forged state-changing GET.
          curl -fsSL -c /tmp/v1-cookies -b /tmp/v1-cookies --data-urlencode 'username=student' --data-urlencode 'password=demo12345' http://localhost:8000/v1/login.php -o /tmp/v1-profile.html
          grep -q 'Khách hàng Demo' /tmp/v1-profile.html
          curl -sS -b /tmp/v1-cookies -o /tmp/v1-update.txt -w '%{http_code}' 'http://localhost:8000/v1/update-profile.php?display_name=CSRF-Attacked' > /tmp/v1-code.txt
          grep -q '302' /tmp/v1-code.txt
          curl -fsS -b /tmp/v1-cookies http://localhost:8000/v1/profile.php -o /tmp/v1-new-profile.html
          grep -q 'CSRF-Attacked' /tmp/v1-new-profile.html
          curl -fsSL -c /tmp/v2-cookies -b /tmp/v2-cookies --data-urlencode 'username=student' --data-urlencode 'password=demo12345' http://localhost:8000/v2/login.php -o /tmp/v2-profile.html
          grep -q 'Khách hàng Demo' /tmp/v2-profile.html
          curl -sS -b /tmp/v2-cookies -o /tmp/v2-update.txt -w '%{http_code}' 'http://localhost:8000/v2/update-profile.php?display_name=CSRF-Attacked' > /tmp/v2-code.txt
          grep -q '405' /tmp/v2-code.txt
          cat /tmp/cas-php.log
